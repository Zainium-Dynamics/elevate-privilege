name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check -p elevate-pam --no-default-features --features std

  check-standalone-elevate-pam:
    name: check (standalone elevate-pam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path elevate-pam/pam/Cargo.toml --release
      - run: cargo build --manifest-path elevate-pam/pam-unix/Cargo.toml --release

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: confirm non-root (tests assume this)
        run: |
          id
          [ "$(id -u)" -ne 0 ] || { echo "runner is root — tests assume non-root, would silently bypass permission checks"; exit 1; }
      - name: tzdata (test_tzinfo needs a real, root-owned /usr/share/zoneinfo)
        run: sudo DEBIAN_FRONTEND=noninteractive TZ=UTC apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive TZ=UTC apt-get install -y -qq --reinstall tzdata
      - name: fix /usr/share/zoneinfo perms (this runner image ships it 777)
        run: sudo chmod 755 /usr/share/zoneinfo
      - run: ls -ld /usr/share/zoneinfo /usr/share/zoneinfo/Europe/Amsterdam
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --tests

  package-static:
    name: package (musl-static)
    runs-on: ubuntu-latest
    needs: [check, check-standalone-elevate-pam, clippy, fmt, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-zainium.sh static
      - run: file dist/zainium/overlayer/syshub/bin/elevate | grep -q "static-pie linked"
      - name: tar
        run: |
          cd dist/zainium/overlayer/syshub
          tar -czf "${GITHUB_WORKSPACE}/elevate-privilege-musl-static.tar.gz" bin sbin
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-privilege-musl-static
          path: elevate-privilege-musl-static.tar.gz
          retention-days: 30

  package-pam-standalone:
    name: package (pam-standalone)
    runs-on: ubuntu-latest
    needs: [check, check-standalone-elevate-pam, clippy, fmt, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --manifest-path elevate-pam/pam/Cargo.toml \
            --no-default-features --features standalone,elevate_crypto
      - name: tar
        run: |
          mkdir -p stage/lib stage/include/security
          cp target/release/libelevate_pam.so stage/lib/libelevate_pam.so.0
          [ -f target/release/libelevate_pam.a ] && cp target/release/libelevate_pam.a stage/lib/ || true
          cp -a elevate-pam/include/security/. stage/include/security/
          tar -czf elevate-pam-standalone.tar.gz -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-pam-standalone
          path: elevate-pam-standalone.tar.gz
          retention-days: 30

  package-elevate-crypto-standalone:
    name: package (elevate-crypto-standalone)
    runs-on: ubuntu-latest
    needs: [check, check-standalone-elevate-pam, clippy, fmt, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --manifest-path elevate-crypto/Cargo.toml
      - name: tar
        run: |
          mkdir -p stage/lib
          cp target/release/libelevate_crypto.so stage/lib/
          [ -f target/release/libelevate_crypto.a ] && cp target/release/libelevate_crypto.a stage/lib/ || true
          tar -czf elevate-crypto-standalone.tar.gz -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-crypto-standalone
          path: elevate-crypto-standalone.tar.gz
          retention-days: 30

  package-config:
    name: package (config)
    runs-on: ubuntu-latest
    needs: [check, check-standalone-elevate-pam, clippy, fmt, test]
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf elevate-privilege-config.tar.gz -C packaging etc
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-privilege-config
          path: elevate-privilege-config.tar.gz
          retention-days: 30

  package-musl-shared:
    name: package (musl-shared, Zainium target)
    runs-on: [self-hosted, zainium-toolchain]
    needs: [check, check-standalone-elevate-pam, clippy, fmt, test]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-05-24 --component rust-src
      - run: ./scripts/build-zainium.sh dynamic
      - run: file dist/zainium/overlayer/syshub/lib/security/pam_unix.so | grep -q "dynamically linked"
      - name: tar
        run: |
          cd dist/zainium/overlayer/syshub
          tar -czf "${GITHUB_WORKSPACE}/elevate-privilege-musl-shared.tar.gz" lib
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-privilege-musl-shared
          path: elevate-privilege-musl-shared.tar.gz
          retention-days: 30

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - test
      - package-static
      - package-pam-standalone
      - package-elevate-crypto-standalone
      - package-config
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: download musl-shared package (optional — may not exist yet)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: elevate-privilege-musl-shared
          path: assets

      - name: checksums
        run: |
          cd assets
          ls -la
          sha256sum *.tar.gz > SHA256SUMS

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" assets/*.tar.gz assets/SHA256SUMS \
            --title "elevate-privilege ${TAG}" \
            --notes "elevate-privilege ${TAG} — memory-safe PAM + sudo + shadow replacement for Zainium OS"
