name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check -p elevate-pam --no-default-features --features alloc
      - run: cargo check -p elevate-pam --no-default-features --features std

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: confirm non-root (tests assume this)
        run: '[ "$(id -u)" -ne 0 ]'
      - run: cargo test --workspace

  release:
    needs: [check, clippy, fmt, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: package
        run: |
          mkdir -p assets/pam/lib assets/pam/include/security
          cp target/release/libelevate_pam.so assets/pam/lib/libelevate_pam.so.0
          cp -a include/security/. assets/pam/include/security/
          cp -a etc assets/pam/etc
          tar -czf assets/elevate-pam-${GITHUB_REF_NAME}.tar.gz -C assets/pam .
          (cd assets && sha256sum *.tar.gz > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*.tar.gz assets/SHA256SUMS \
            --target "$GITHUB_SHA" --title "elevate-pam $GITHUB_REF_NAME" \
            --notes "elevate-pam $GITHUB_REF_NAME — PAM engine, modules and CLI."
