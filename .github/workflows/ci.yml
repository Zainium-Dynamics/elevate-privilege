name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check -p elevate-pam --no-default-features --features std

  check-standalone-elevate-pam:
    name: check (standalone elevate-pam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path elevate-pam/pam/Cargo.toml --release
      - run: cargo build --manifest-path elevate-pam/pam-unix/Cargo.toml --release

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: confirm non-root (tests assume this)
        run: |
          id
          [ "$(id -u)" -ne 0 ] || { echo "runner is root — tests assume non-root, would silently bypass permission checks"; exit 1; }
      - name: tzdata (test_tzinfo needs a real, root-owned /usr/share/zoneinfo)
        run: sudo DEBIAN_FRONTEND=noninteractive TZ=UTC apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive TZ=UTC apt-get install -y -qq --reinstall tzdata
      - name: fix /usr/share/zoneinfo perms (this runner image ships it 777)
        run: sudo chmod 755 /usr/share/zoneinfo
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --tests

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [check, check-standalone-elevate-pam, clippy, fmt, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build pam-standalone
        run: |
          cargo build --release --manifest-path elevate-pam/pam/Cargo.toml \
            --no-default-features --features standalone,elevate_crypto
          mkdir -p assets/pam-standalone/lib assets/pam-standalone/include/security
          cp target/release/libelevate_pam.so assets/pam-standalone/lib/libelevate_pam.so.0
          [ -f target/release/libelevate_pam.a ] && cp target/release/libelevate_pam.a assets/pam-standalone/lib/ || true
          cp -a elevate-pam/include/security/. assets/pam-standalone/include/security/
          tar -czf assets/elevate-pam-standalone.tar.gz -C assets/pam-standalone .

      - name: build elevate-crypto-standalone
        run: |
          cargo build --release --manifest-path elevate-crypto/Cargo.toml
          mkdir -p assets/crypto-standalone/lib
          cp target/release/libelevate_crypto.so assets/crypto-standalone/lib/
          [ -f target/release/libelevate_crypto.a ] && cp target/release/libelevate_crypto.a assets/crypto-standalone/lib/ || true
          tar -czf assets/elevate-crypto-standalone.tar.gz -C assets/crypto-standalone .

      - name: package config
        run: tar -czf assets/elevate-privilege-config.tar.gz etc

      - name: checksums
        run: |
          cd assets
          rm -rf pam-standalone crypto-standalone
          ls -la
          sha256sum *.tar.gz > SHA256SUMS

      - name: publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"

          # Idempotent: a tag/release may already exist (e.g. created via the
          # GitHub UI before this workflow ran) — upload+overwrite assets into
          # it instead of failing on "release already exists".
          publish() {
            local release_tag="$1" title="$2" notes="$3"; shift 3
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release upload "$release_tag" "$@" --clobber
              gh release edit "$release_tag" --title "$title" --notes "$notes"
            else
              gh release create "$release_tag" "$@" \
                --target "$GITHUB_SHA" --title "$title" --notes "$notes"
            fi
          }

          publish "$TAG" \
            "elevate-privilege ${TAG}" \
            "elevate-privilege ${TAG} — memory-safe PAM + sudo + shadow replacement for Zainium OS" \
            assets/elevate-privilege-config.tar.gz assets/SHA256SUMS

          publish "elevate-pam-standalone-${TAG}" \
            "elevate-pam standalone ${TAG}" \
            "Self-contained libelevate_pam (all builtin modules compiled in, no dlopen) — any distro, glibc or musl, not Zainium-specific." \
            assets/elevate-pam-standalone.tar.gz

          publish "elevate-crypto-standalone-${TAG}" \
            "elevate-crypto standalone ${TAG}" \
            "libelevate_crypto on its own — Argon2id/Blake3/Ed25519, pure Rust, no C OpenSSL." \
            assets/elevate-crypto-standalone.tar.gz
