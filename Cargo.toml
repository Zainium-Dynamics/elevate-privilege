# elevate-pam -- PAM engine, builtin modules and CLI (Linux-PAM replacement)
#
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "2"
members = [
    "pam",
    "libpam-abi",
    "libpam-misc",
    "elevate-pam-cli",
    "pam-unix",
    "pam-env",
    "pam-limits",
    "pam-deny",
    "pam-permit",
    "pam-rootok",
    "pam-wheel",
    "pam-nologin",
    "pam-securetty",
    "pam-access",
    "pam-faillock",
    "pam-mkhomedir",
    "pam-pwhistory",
    "pam-loginuid",
    "pam-cap",
    "pam-listfile",
    "pam-timestamp",
    "pam-keyinit",
    "pam-group",
    "pam-time",
    "pam-xauth",
    "pam-canonicalize-user",
    "pam-filter",
    "pam-ftp",
    "pam-stress",
    "pam-tally2",
    "pam-namespace",
    "pam-systemd",
    "helpers/unix_chkpwd",
]
default-members = [
    "pam",
    "libpam-abi",
    "libpam-misc",
    "elevate-pam-cli",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["alizain <alizain@zainiumdynamics.tech>"]
homepage = "https://zainiumdynamics.tech"
repository = "https://github.com/Zainium-Dynamics/elevate-privilege"
categories = ["authentication", "os::linux-apis"]
keywords = ["pam", "authentication", "linux", "security"]

[workspace.dependencies]
elevate-pam = { path = "pam", version = "1.0.1" }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
