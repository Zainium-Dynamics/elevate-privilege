# elevate monorepo — single workspace
# Layout:
#   elevate-crypto/   pure Rust: Blake3 + Ed25519 + password-crypt (no C OpenSSL)
#   elevate-pam/      libelevate_pam + modules + CLI
#   elevate/     elevate / elev / viselev
#
# One config file: elevate.toml (shared / static / standalone, paths, crypto)
#
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "2"
members = [
    # shared install-path config (single source of truth for elevate_privilege.toml)
    "elevate-paths",
    # crypto
    "elevate-crypto",
    # pam core + CLI
    "elevate-pam/pam",
    "elevate-pam/elevate-pam-cli",
    # pam modules
    "elevate-pam/pam-unix",
    "elevate-pam/pam-env",
    "elevate-pam/pam-limits",
    "elevate-pam/pam-deny",
    "elevate-pam/pam-permit",
    "elevate-pam/pam-rootok",
    "elevate-pam/pam-wheel",
    "elevate-pam/pam-nologin",
    "elevate-pam/pam-securetty",
    "elevate-pam/pam-access",
    "elevate-pam/pam-faillock",
    "elevate-pam/pam-mkhomedir",
    "elevate-pam/pam-pwhistory",
    "elevate-pam/pam-loginuid",
    "elevate-pam/pam-cap",
    "elevate-pam/pam-listfile",
    "elevate-pam/pam-timestamp",
    "elevate-pam/pam-keyinit",
    "elevate-pam/pam-group",
    "elevate-pam/pam-time",
    "elevate-pam/pam-xauth",
    "elevate-pam/pam-canonicalize-user",
    "elevate-pam/pam-filter",
    "elevate-pam/pam-ftp",
    "elevate-pam/pam-stress",
    "elevate-pam/pam-tally2",
    "elevate-pam/pam-namespace",
    "elevate-pam/helpers/unix_chkpwd",
    # sudo replacement
    "elevate",
    # shadow replacement
    "elevate-umbra",
]
default-members = [
    "elevate-paths",
    "elevate-crypto",
    "elevate-pam/pam",
    "elevate-pam/elevate-pam-cli",
    "elevate",
    "elevate-umbra",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["alizain <alizain@zainiumdynamics.tech>"]
homepage = "https://zainiumdynamics.tech"
repository = "https://gitlab.com/zainium-dynamics/elevate-privilege"
categories = ["authentication", "cryptography", "os::linux-apis"]
keywords = ["elevate", "crypto", "pam", "ed25519", "blake3"]

[workspace.dependencies]
elevate-paths = { path = "elevate-paths", version = "1.0.0" }
elevate-crypto = { path = "elevate-crypto", version = "1.0.0" }
elevate-pam = { path = "elevate-pam/pam", version = "1.0.0" }
elevate-umbra = { path = "elevate-umbra", version = "1.0.0" }
libc = "0.2"
glob = "0.3"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "rand_core"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
bcrypt = "0.16"
sha-crypt = "0.5"
getrandom = "0.2"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc"] }
subtle = { version = "2.5", default-features = false }
bitflags = "2.6"
once_cell = "1.20"
nix = { version = "0.29", default-features = false, features = ["user", "fs", "process", "signal"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
