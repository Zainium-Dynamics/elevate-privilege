# =============================================================================
# elevate-privilege — GitLab CI/CD
# =============================================================================
# Fix for empty/instant-failed pipelines:
#   Settings → CI/CD → Runners → enable "Turn on instance runners for this project"
#
# The `package:musl-shared` job cross-builds for Zainium OS's own musl
# target (x86_64-zainium-linux-musl) using a crosstool-NG toolchain that
# lives on a physical drive, not on GitLab.com's shared runners. It's
# tagged for a self-hosted runner and `allow_failure: true` until that
# runner is registered (see scripts/build-zainium.sh, scripts/package-zainium.sh)
# — it does not block the rest of the pipeline going green.
#
# Packages follow the Zainium syshub package convention (manifest.toml +
# payload/, _syshub = true) — see scripts/package-zainium.sh for the full
# rationale and scripts/package-zainium.sh's header comment for why there
# are exactly three: musl-shared (PAM .so's + crypto, real Zainium target),
# musl-static (elevate/elev/vielev + elevate-umbra, generic musl crt-static),
# pam-standalone (portable, self-contained libelevate_pam for any distro).
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - test
  - build
  - package
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-ci"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  FF_TIMESTAMPS: "true"

default:
  image: rust:latest
  interruptible: true

# ── cache template ───────────────────────────────────────────────────────
.cargo_job:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: elevate-privilege-cargo
    paths:
      - .cargo-ci/registry/
      - .cargo-ci/git/
      - target/
    policy: pull-push
  before_script:
    - rustc --version && cargo --version
    - rustup show

# =============================================================================
# check
# =============================================================================

check:
  extends: .cargo_job
  stage: check
  script:
    - cargo check --workspace
    - cargo check -p elevate-pam --no-default-features --features std

# elevate-pam must stay buildable outside this monorepo (see
# elevate-pam/README.md) -- exercised here via --manifest-path so a
# workspace-only path dependency regression fails CI instead of surfacing
# only when a downstream distro tries to package it.
check:standalone-elevate-pam:
  extends: .cargo_job
  stage: check
  script:
    - cargo build --manifest-path elevate-pam/pam/Cargo.toml --release
    - cargo build --manifest-path elevate-pam/pam-unix/Cargo.toml --release

clippy:
  extends: .cargo_job
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

# Large pre-existing codebase, not yet fmt-clean everywhere -- non-blocking
# until it is.
fmt:
  extends: .cargo_job
  stage: check
  allow_failure: true
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

# =============================================================================
# test
# =============================================================================

test:
  extends: .cargo_job
  stage: test
  timeout: 45m
  script:
    - cargo test --workspace --lib
    - cargo test --workspace --tests

# =============================================================================
# build
# =============================================================================

# Host glibc build -- default target, all PAM .so modules + crypto + sudo
# replacement + shadow replacement, all workspace default-members.
build:
  extends: .cargo_job
  stage: build
  script:
    - ./scripts/build-all.sh
    - test -x target/release/elevate
    - test -f target/release/libelevate_pam.so
    - test -f target/release/libpam_unix.so
  artifacts:
    name: "elevate-privilege-glibc-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - target/release/elevate
      - target/release/elev
      - target/release/vielev
      - target/release/libelevate_pam.so
      - target/release/libelevate_crypto.so
      - target/release/libpam_*.so

# =============================================================================
# package -- Zainium syshub packages (manifest.toml + payload/), see
# scripts/package-zainium.sh. Each produces a
# <name>-<version>_<version>.tar.gz + .sha256 under dist/syshub-packages/.
# =============================================================================

# Generic musl-static elevate/elev/vielev + elevate-umbra binaries (rustup's
# own self-contained musl, no external toolchain needed -- see
# elevate/MUSL_BUILD_README.md). Distinct from package:musl-shared below,
# which targets Zainium OS's own musl specifically.
package:musl-static:
  extends: .cargo_job
  stage: package
  script:
    - rustup target add x86_64-unknown-linux-musl
    - ./scripts/package-zainium.sh musl-static
    - file dist/zainium/overlayer/syshub/bin/elevate | grep -q "static-pie linked"
  artifacts:
    name: "elevate-privilege-musl-static-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/syshub-packages/elevate-privilege-musl-static-*

# Portable, self-contained libelevate_pam (all builtin modules compiled in,
# no dlopen) -- a Linux-PAM replacement any distro (glibc or musl) can use,
# not Zainium-specific. Built for the runner's host default target.
package:pam-standalone:
  extends: .cargo_job
  stage: package
  script:
    - ./scripts/package-zainium.sh pam-standalone
  artifacts:
    name: "elevate-pam-standalone-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/syshub-packages/elevate-pam-standalone-*

# Real Zainium OS target: PAM .so modules + libelevate_pam.so +
# libelevate_crypto.so built with the crosstool-NG toolchain via nightly
# `-Z build-std` (see scripts/build-zainium.sh and targets/x86_64-zainium-linux-musl.json).
# Needs a self-hosted runner with the toolchain available at
# $ZAINIUM_TOOLCHAIN_BIN (CI/CD variable) -- not yet registered, so this
# stays allow_failure until it is.
package:musl-shared:
  stage: package
  tags:
    - zainium-toolchain
  allow_failure: true
  before_script:
    - rustup toolchain install nightly-2026-05-24 --component rust-src
  script:
    - ./scripts/package-zainium.sh musl-shared
    - file dist/zainium/overlayer/syshub/lib/security/pam_unix.so | grep -q "dynamically linked"
  artifacts:
    name: "elevate-privilege-musl-shared-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/syshub-packages/elevate-privilege-musl-shared-*

# =============================================================================
# release (only vX.Y.Z tags)
# =============================================================================

release:
  stage: release
  image: curlimages/curl:8.12.1
  needs:
    - job: package:musl-static
      artifacts: true
    - job: package:pam-standalone
      artifacts: true
    - job: package:musl-shared
      artifacts: true
      optional: true
    - job: test
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - |
      set -eu
      TAG="$CI_COMMIT_TAG"
      cd dist/syshub-packages
      ls -la
      ASSET_LINKS=""
      for f in *.tar.gz; do
        [ -f "$f" ] || continue
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/elevate-privilege/${TAG}/${f}"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${f}.sha256" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/elevate-privilege/${TAG}/${f}.sha256"
        pkg_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/elevate-privilege/${TAG}/${f}"
        ASSET_LINKS="${ASSET_LINKS}{\"name\":\"${f}\",\"url\":\"${pkg_url}\",\"link_type\":\"package\"},"
      done
      ASSET_LINKS="${ASSET_LINKS%,}"
      DESC="elevate-privilege ${TAG} — memory-safe PAM + sudo + shadow replacement for Zainium OS"
      DATA=$(printf '{"name":"elevate-privilege %s","tag_name":"%s","description":"%s","assets":{"links":[%s]}}' \
        "$TAG" "$TAG" "$DESC" "$ASSET_LINKS")
      curl --fail --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$DATA" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
        || echo "Release may already exist; package upload OK."
