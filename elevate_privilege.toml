# elevate — single monorepo configuration (TOML only, no JSON)

# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Zainium paths: immutable base under /overlayer/syshub (no /usr, no bare
# /bin /sbin /lib /etc at root) — see [paths] below.
# Crypto is 100% pure Rust (no C OpenSSL).

[project]
name = "elevate"
version = "1.0.1"
author = "alizain"
email = "alizain@zainiumdynamics.tech"
website = "https://zainiumdynamics.tech"
license = "MIT OR Apache-2.0"

[build]
shared = true
static = false
standalone = false
rust_version = "1.96"
lto = true
strip = true

[features]
std = true
alloc = true
blake3 = true
ed25519 = true
password = true
legacy_shadow = true
# no C OpenSSL
openssl_c = false
system_crypt = true
dynload = true
syslog = true
legacy_pamd = false
secure_mem = true
fail_delay = true
builtin_modules = true

[paths]
prefix = "/overlayer/syshub"
bindir = "/overlayer/syshub/bin"
sbindir = "/overlayer/syshub/bin"
libdir = "/overlayer/syshub/lib"
var_dir = "/overlayer/syshub/var"
includedir = "/overlayer/syshub/include"
conf_dir = "/overlayer/syshub/etc/elevate-pam"
services_dir = "/overlayer/syshub/etc/elevate-pam/services"
services_dropin_dir = "/overlayer/syshub/etc/elevate-pam/services.d"
module_dir = "/overlayer/syshub/lib/security"
vendor_dir = "/overlayer/syshub/lib/elevate-pam/services"
default_service = "other"
elevators_dir = "/overlayer/syshub/etc/elevators"
elevators_file = "/overlayer/syshub/etc/elevators/elevate.toml"


[crypto]
# Pure Rust only
implementation = "rust"
hash = "blake3"
signature = "ed25519"
password_preferred = "argon2id"
legacy_shadow_verify = true
# C OpenSSL is NOT used
openssl_c = false

[security]
fail_delay_usec = 2_000_000
zeroize_authtok = true
reject_service_paths = true
max_include_depth = 32
max_substack_level = 16
max_stack_modules = 64

[logging]
facility = "authpriv"
level = "info"
ident = "elevate"

# Cross-libc build targets. Mirrored into the workspace-root .cargo/config.toml
# as static [target.<triple>] linker sections — Cargo resolves --target and
# its linker before any build.rs runs, so this can't be picked dynamically
# per-invocation; pass --target explicitly to select one; the host default
# (glibc) is used otherwise. `cargo build --release` with no --target keeps
# building against whatever your host's default target is.
[targets.musl]
triple = "x86_64-unknown-linux-musl"
# NOTE: on this toolchain, cdylib (elevate-pam's .so modules) gets silently
# dropped when cross-building for musl without a musl shared-object linker
# available — musl-static is intended for the elevate/elev/viselev binaries
# specifically (see elevate/.cargo/config.toml), not the whole workspace.
crt_static = false

[targets.glibc]
triple = "x86_64-unknown-linux-gnu"
# Host default on most Linux dev/build machines; no special linker needed.
crt_static = false

[components]
crypto = true
pam = true
sudo = true
