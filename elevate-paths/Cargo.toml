[package]
# NOTE: pinned explicitly (not `.workspace = true`) -- see elevate-crypto's
# Cargo.toml for why. Keep in sync with the workspace root Cargo.toml's
# [workspace.package].
name = "elevate-paths"
description = "Shared install-path configuration for the elevate monorepo, driven by elevate_privilege.toml (Zainium Dynamics)"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/zainium-dynamics/elevate-privilege"
homepage = "https://zainiumdynamics.tech"
authors = ["alizain <alizain@zainiumdynamics.tech>"]
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
toml = "0.8"
