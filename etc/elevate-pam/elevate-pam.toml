# elevate-pam — system configuration
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Install as /etc/elevate-pam/elevate-pam.toml (or point $ELEVATE_PAM_CONFIG
# at it). Service stacks live in <conf_dir>/services/<name>.toml.

[project]
name = "elevate-pam"
version = "1.0.1"
license = "MIT OR Apache-2.0"

[build]
shared = true
static = false
standalone = false

# Where elevate-pam finds its files. Every key is optional; anything unset is
# derived from `prefix` (default "" = the real `/`), so changing only `prefix`
# moves everything together. Defaults shown in comments:
[paths]
# prefix = ""                                  # install root
# etc_dir = "<prefix>/etc"                     # passwd, shadow, security/*, ...
# conf_dir = "<etc_dir>/elevate-pam"           # this file, services/, services.d/
# module_dir = "<prefix>/lib/security"         # pam_*.so
# vendor_dir = "<prefix>/lib/elevate-pam/services"
# var_dir = "<prefix>/var/run/elevate"         # faillock, tallylog, timestamps
#
# Example: a distro whose whole tree lives under /overlayer/syshub
# prefix = "/overlayer/syshub"
default_service = "other"

[security]
fail_delay_usec = 2_000_000
zeroize_authtok = true
reject_service_paths = true
max_include_depth = 32
max_substack_level = 16
max_stack_modules = 64

[logging]
facility = "authpriv"
level = "info"
ident = "elevate-pam"
