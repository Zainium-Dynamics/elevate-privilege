# /etc/security/limits.conf — used by elevate-pam limits module
# Format: <domain> <type> <item> <value>
#
# *               soft    nofile          1024
# *               hard    nofile          65535
# @wheel          -       nice            -10
# root            hard    core            unlimited

# Default: leave empty (no extra rlimits). Site admins customize here.
